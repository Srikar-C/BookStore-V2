spring.config.import=file:.env[.properties]

spring.application.name=IdentityService


server.port=${IDENTITY_SERVER_PORT:8080}

#making apis strict to this port
server.servlet.session.cookie.same-site=strict

#database configuration
spring.datasource.url=${DB_USER_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

#hibernate (to create tables automatic via JPA)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#sending data to mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true